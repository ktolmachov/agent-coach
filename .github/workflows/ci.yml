name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        # actions/setup-python@v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install -e ".[dev,build]"
      - name: Import package
        run: python -c "import agent_coach; print(agent_coach.__version__)"
      - name: Run package artifact smoke
        run: python -m pytest tests/test_package_smoke.py
      - name: Run tests
        run: python -m pytest
      - name: Run Ruff
        run: python -m ruff check .
      - name: Compile package and scripts
        run: python -m compileall src scripts
      - name: Check contract export
        run: python scripts/check_contract_export.py
      - name: Check OpenAPI snapshot
        run: python scripts/check_openapi_snapshot.py
      - name: Check drift gate
        run: python scripts/check_drift_gate.py
      - name: Check public release gate
        run: python scripts/check_public_release.py
      - name: Check strict public release hygiene
        run: python scripts/check_public_release.py --release
      - name: Run offline eval gate
        run: python scripts/run_eval_gate.py
      - name: Run diploma demo evidence script
        run: python scripts/run_diploma_demo.py
